<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e16;
      --bg2: #17171f;
      --bg3: #1f1f2c;
      --border: rgba(255,255,255,0.07);
      --ink: #e4e4f0;
      --ink2: #7a7a92;
      --accent: #6c6cff;
      --success: #3ecf8e;
      --danger: #f87171;
    }

    [data-theme="light"] {
      --bg: #f5f5f8;
      --bg2: #ffffff;
      --bg3: #eeeef4;
      --border: rgba(0,0,0,0.08);
      --ink: #111118;
      --ink2: #666677;
      --accent: #4a4aff;
      --success: #16a34a;
      --danger: #dc2626;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      width: 260px;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      color: inherit;
      text-decoration: none;
      border-radius: 8px;
      outline: none;
      transition: color 0.12s, transform 0.12s;
    }
    .header-left:hover,
    .header-left:focus-visible {
      color: var(--accent);
      transform: translateY(-1px);
    }
    .logo {
      width: 24px; height: 24px;
      background: var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #fff;
    }
    .title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }

    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 12px;
    }

    .desc {
      font-size: 12px;
      color: var(--ink2);
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--ink2);
      margin-bottom: 12px;
    }

    .theme-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .theme-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .theme-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
    }

    .theme-value {
      font-size: 11px;
      color: var(--ink2);
    }

    .theme-toggle {
      position: relative;
      width: 42px;
      height: 24px;
      flex-shrink: 0;
    }

    .theme-toggle input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .theme-toggle-track {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: var(--bg3);
      border: 1px solid var(--border);
      transition: background 0.12s, border-color 0.12s;
    }

    .theme-toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--ink);
      transition: transform 0.12s, background 0.12s;
      pointer-events: none;
    }

    .theme-toggle input:checked + .theme-toggle-track {
      background: rgba(108,108,255,0.18);
      border-color: var(--accent);
    }

    .theme-toggle input:checked + .theme-toggle-track + .theme-toggle-thumb {
      transform: translateX(18px);
      background: var(--accent);
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--danger);
      flex-shrink: 0;
    }
    .dot.ok { background: var(--success); }

    input, select {
      font-family: inherit;
    }

    #languageSelect {
      width: 92px;
      padding: 6px 8px;
      background: var(--bg3);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      outline: none;
    }

    .settings-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px;
      background: var(--bg2);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s, border-color 0.12s;
    }
    .settings-btn:hover {
      background: var(--bg3);
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="header">
    <a class="header-left" href="https://github.com/OmniLLM/omni-pilot" target="_blank" rel="noopener noreferrer" title="Open OmniPilot on GitHub">
      <div class="logo">✦</div>
      <span class="title">OmniPilot</span>
    </a>
  </div>

  <div class="divider"></div>

  <div class="desc" id="desc" data-i18n="selectTextDesc">Select text on any page for AI actions.</div>

  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span id="statusText" aria-live="polite">Checking…</span>
  </div>

  <div class="theme-row">
    <div class="theme-copy">
      <span class="theme-label" id="themeLabel" data-i18n="theme">Theme</span>
      <span class="theme-value" id="themeValue">Dark</span>
    </div>
    <label class="theme-toggle" data-i18n-aria-label="toggleDarkMode" aria-label="Toggle dark mode">
      <input type="checkbox" id="themeToggle" checked>
      <span class="theme-toggle-track"></span>
      <span class="theme-toggle-thumb"></span>
    </label>
  </div>

  <div class="theme-row">
    <div class="theme-copy">
      <span class="theme-label" id="languageLabel" data-i18n="language">Language</span>
    </div>
    <select id="languageSelect" aria-label="Language">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </div>

  <button class="settings-btn" id="settingsBtn">
    <span>⚙</span> <span id="settingsLabel" data-i18n="settings">Settings</span>
  </button>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
