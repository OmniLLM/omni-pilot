<!DOCTYPE html>
<html lang="en" data-appearance-root data-surface="sidepanel" data-theme-preference="dark" data-theme="dark" data-visual-style="current">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniPilot</title>
  <link rel="stylesheet" href="appearance.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--appearance-font-body);
      background: var(--appearance-canvas);
      color: var(--appearance-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .sp-header {
      padding: var(--appearance-space-3) var(--appearance-space-4);
      border-bottom: var(--appearance-border-width) solid var(--appearance-border);
      display: flex;
      align-items: center;
      gap: var(--appearance-space-2);
      flex-shrink: 0;
      background: var(--appearance-surface);
    }

    .sp-header h1 {
      font-family: var(--appearance-font-display);
      font-size: var(--appearance-font-size-lg);
      font-weight: var(--appearance-weight-strong);
      letter-spacing: var(--appearance-heading-tracking);
      text-transform: var(--appearance-heading-transform);
    }

    .sp-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--appearance-space-3) var(--appearance-space-4);
      display: flex;
      flex-direction: column;
      gap: var(--appearance-row-gap);
    }

    .sp-msg {
      padding: 10px 14px;
      border-radius: 0;
      font-size: var(--appearance-font-size-md);
      line-height: var(--appearance-line-height-body);
      max-width: 95%;
      overflow-wrap: anywhere;
      box-shadow: var(--appearance-shadow-1);
    }

    .sp-msg-user {
      background: var(--appearance-accent);
      color: var(--appearance-on-accent);
      align-self: flex-end;
      border-radius: 0;
    }

    .sp-msg-assistant {
      background: var(--appearance-surface);
      color: var(--appearance-text);
      align-self: flex-start;
      border: var(--appearance-border-width) solid var(--appearance-border);
      border-radius: 0;
    }

    .sp-msg-assistant.sp-streaming::after {
      content: '█';
      animation: sp-blink 0.6s step-end infinite;
      color: var(--appearance-accent);
      margin-left: 1px;
    }

    @keyframes sp-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .sp-input-area {
      padding: var(--appearance-space-3) var(--appearance-space-4);
      border-top: var(--appearance-border-width) solid var(--appearance-border);
      display: flex;
      gap: var(--appearance-space-2);
      flex-shrink: 0;
      background: var(--appearance-surface);
    }

    .sp-input {
      flex: 1;
      border: var(--appearance-border-width) solid var(--appearance-border);
      border-radius: 0;
      padding: var(--appearance-space-2) var(--appearance-space-3);
      font: inherit;
      font-size: var(--appearance-font-size-md);
      background: var(--appearance-canvas);
      color: var(--appearance-text);
      outline: none;
      resize: none;
      min-height: var(--appearance-control-height);
      max-height: 120px;
      transition: border-color var(--appearance-transition-duration) var(--appearance-transition-easing);
    }

    .sp-input:focus-visible {
      border-color: var(--appearance-focus);
      outline: var(--appearance-border-width-strong) solid var(--appearance-focus);
      outline-offset: 1px;
    }

    .sp-input::placeholder { color: var(--appearance-text-subtle); }

    .sp-send {
      background: var(--appearance-accent);
      color: var(--appearance-on-accent);
      border: var(--appearance-border-width) solid var(--appearance-accent);
      border-radius: 0;
      padding: var(--appearance-space-2) var(--appearance-space-4);
      cursor: pointer;
      font: inherit;
      font-size: var(--appearance-font-size-md);
      font-weight: var(--appearance-weight-medium);
      align-self: flex-end;
      min-height: var(--appearance-control-height);
      box-shadow: var(--appearance-shadow-1);
      transition: background var(--appearance-transition-duration) var(--appearance-transition-easing);
    }

    .sp-send:hover { background: var(--appearance-accent-hover); }
    .sp-send:active { transform: var(--appearance-active-transform); }
    .sp-send:focus-visible {
      outline: var(--appearance-border-width-strong) solid var(--appearance-focus);
      outline-offset: 2px;
    }

    .sp-empty {
      text-align: center;
      color: var(--appearance-text-muted);
      padding: 40px 20px;
      font-size: var(--appearance-font-size-md);
    }

    .sp-error {
      color: var(--appearance-danger);
      background: var(--appearance-surface);
      border-left: var(--appearance-border-width-strong) solid var(--appearance-danger);
      padding: var(--appearance-space-2) var(--appearance-space-3);
      border-radius: 0;
      font-size: var(--appearance-font-size-sm);
    }
  </style>
</head>
<body>
  <div class="sp-header">
    <span aria-hidden="true">✦</span>
    <h1>OmniPilot</h1>
  </div>
  <div class="sp-body" id="chatBody">
    <div class="sp-empty">Start a conversation. Ask anything.</div>
  </div>
  <div class="sp-input-area">
    <textarea class="sp-input" id="chatInput" placeholder="Ask anything..." rows="1"></textarea>
    <button class="sp-send" id="sendBtn">Send</button>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
