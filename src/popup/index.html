<!DOCTYPE html>
<html lang="en" data-appearance-root data-surface="popup" data-theme-preference="dark" data-theme="dark" data-visual-style="current">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="appearance.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: var(--appearance-canvas);
      --bg2: var(--appearance-surface);
      --bg3: var(--appearance-surface-raised);
      --border: var(--appearance-border);
      --ink: var(--appearance-text);
      --ink2: var(--appearance-text-muted);
      --accent: var(--appearance-accent);
      --success: var(--appearance-success);
      --danger: var(--appearance-danger);
    }

    body {
      font-family: var(--appearance-font-body);
      background: var(--bg);
      color: var(--ink);
      width: 260px;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      color: inherit;
      text-decoration: none;
      border-radius: 0;
      outline: none;
      transition: color 0.12s, transform 0.12s;
    }
    .header-left:hover,
    .header-left:focus-visible {
      color: var(--accent);
      transform: translateY(-1px);
    }
    .logo {
      width: 24px; height: 24px;
      background: var(--accent);
      border-radius: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--appearance-on-accent);
    }
    .title {
      font-family: var(--appearance-font-display);
      font-size: var(--appearance-font-size-md);
      font-weight: var(--appearance-weight-strong);
      letter-spacing: var(--appearance-heading-tracking);
      text-transform: var(--appearance-heading-transform);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 12px;
    }

    .desc {
      font-size: var(--appearance-font-size-sm);
      color: var(--ink2);
      line-height: var(--appearance-line-height-body);
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--ink2);
      margin-bottom: 12px;
    }

    .theme-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: var(--appearance-row-gap);
      padding: 10px 12px;
      background: var(--bg2);
      border: var(--appearance-border-width) solid var(--border);
      border-radius: 0;
      box-shadow: var(--appearance-shadow-1);
    }

    .theme-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .theme-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
    }

    .theme-value {
      font-size: 11px;
      color: var(--ink2);
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 0;
      background: var(--danger);
      flex-shrink: 0;
    }
    .dot.ok { background: var(--success); }

    .appearance-controls .theme-copy { width: 100%; }
    .appearance-controls .theme-label { margin-bottom: 8px; }

    .preference-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .preference-row:last-child { margin-bottom: 0; }

    .preference-row label {
      font-size: 11px;
      color: var(--ink2);
    }

    input, select {
      font-family: inherit;
    }

    .preference-row select,
    #languageSelect {
      width: 100%;
      min-height: 30px;
      padding: 5px 7px;
      background: var(--bg3);
      color: var(--ink);
      border: var(--appearance-border-width) solid var(--border);
      border-radius: 0;
      font-size: 11px;
      outline: none;
    }

    .preference-row select:focus-visible,
    #languageSelect:focus-visible,
    .settings-btn:focus-visible {
      outline: 2px solid var(--appearance-focus);
      outline-offset: 2px;
    }

    #languageSelect {
      width: 92px;
      font-size: 12px;
    }

    .settings-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px;
      background: var(--bg2);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 0;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s, border-color 0.12s;
    }
    .settings-btn:hover {
      background: var(--bg3);
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="header">
    <a class="header-left" href="https://github.com/OmniLLM/omni-pilot" target="_blank" rel="noopener noreferrer" title="Open OmniPilot on GitHub">
      <div class="logo">✦</div>
      <span class="title">OmniPilot</span>
    </a>
  </div>

  <div class="divider"></div>

  <div class="desc" id="desc" data-i18n="selectTextDesc">Select text on any page for AI actions.</div>

  <div class="status-row">
    <span class="dot" id="statusDot"></span>
    <span id="statusText" aria-live="polite">Checking…</span>
  </div>

  <div class="theme-row appearance-controls" aria-labelledby="appearanceLabel">
    <div class="theme-copy">
      <span class="theme-label" id="appearanceLabel" data-i18n="appearance">Appearance</span>
      <div class="preference-row">
        <label for="themePreferenceSelect" data-i18n="themePreference">Color theme</label>
        <select id="themePreferenceSelect">
          <option value="system" data-i18n="themeSystem">System</option>
          <option value="light" data-i18n="light">Light</option>
          <option value="dark" data-i18n="dark">Dark</option>
        </select>
      </div>
      <div class="preference-row">
        <label for="visualStylePreferenceSelect" data-i18n="visualStyle">Visual style</label>
        <select id="visualStylePreferenceSelect">
          <option value="current" data-i18n="visualStyleCurrent">Current</option>
          <option value="clean-minimal" data-i18n="visualStyleCleanMinimal">Clean Minimal</option>
          <option value="terminal" data-i18n="visualStyleTerminal">Terminal</option>
          <option value="warm-editorial" data-i18n="visualStyleWarmEditorial">Warm Editorial</option>
          <option value="neo-brutalist" data-i18n="visualStyleNeoBrutalist">Neo-brutalist</option>
        </select>
      </div>
    </div>
  </div>

  <div class="theme-row">
    <div class="theme-copy">
      <span class="theme-label" id="languageLabel" data-i18n="language">Language</span>
    </div>
    <select id="languageSelect" aria-label="Language">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </div>

  <button class="settings-btn" id="settingsBtn">
    <span>⚙</span> <span id="settingsLabel" data-i18n="settings">Settings</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
