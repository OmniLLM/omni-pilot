<!DOCTYPE html>
<html lang="en" data-appearance-root data-surface="popup" data-theme-preference="dark" data-theme="dark" data-visual-style="current">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="appearance.css">
  <link rel="stylesheet" href="tailwind.css">
  <style>
    /* In @layer base so utilities can override it. Unlayered CSS beats layered
       CSS regardless of specificity, so an unlayered `*` reset would silently
       cancel every utility margin and padding. Layer order is declared in
       src/styles/tailwind.css as: base < theme < utilities < unlayered. */
    @layer base {
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    }

    :root {
      --bg: var(--appearance-canvas);
      --bg2: var(--appearance-surface);
      --bg3: var(--appearance-surface-raised);
      --border: var(--appearance-border);
      --ink: var(--appearance-text);
      --ink2: var(--appearance-text-muted);
      --accent: var(--appearance-accent);
      --success: var(--appearance-success);
      --danger: var(--appearance-danger);
    }

    body {
      font-family: var(--appearance-font-body);
      background: var(--bg);
      color: var(--ink);
      width: 260px;
      padding: 16px;
    }

    /* Interactive states and var()-driven values that utilities cannot express.
       Static layout, spacing, color, and typography now live on op: utilities
       in the markup below. */

    .header-left {
      transition: color 0.12s, transform 0.12s;
    }
    .header-left:hover,
    .header-left:focus-visible {
      color: var(--accent);
      transform: translateY(-1px);
    }
    .header-left:focus-visible { outline: none; }

    .title {
      text-transform: var(--appearance-heading-transform);
    }

    .theme-row {
      margin-bottom: var(--appearance-row-gap);
      border: var(--appearance-border-width) solid var(--border);
    }

    .appearance-controls .theme-copy { width: 100%; }
    .appearance-controls .theme-label { margin-bottom: 8px; }

    .preference-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .preference-row:last-child { margin-bottom: 0; }

    input, select {
      font-family: inherit;
    }

    .preference-row select,
    #languageSelect {
      width: 100%;
      min-height: 30px;
      padding: 5px 7px;
      background: var(--bg3);
      color: var(--ink);
      border: var(--appearance-border-width) solid var(--border);
      border-radius: 0;
      font-size: 11px;
      outline: none;
    }

    .preference-row select:focus-visible,
    #languageSelect:focus-visible,
    .settings-btn:focus-visible {
      outline: 2px solid var(--appearance-focus);
      outline-offset: 2px;
    }

    #languageSelect {
      width: 92px;
      font-size: 12px;
    }

    /* Status dot: `.ok` is toggled from src/popup/index.mjs via classList,
       so this state pair must stay a CSS rule. */
    .dot { background: var(--danger); }
    .dot.ok { background: var(--success); }

    .settings-btn {
      border: 1px solid var(--border);
      transition: background 0.12s, border-color 0.12s;
    }
    .settings-btn:hover {
      background: var(--bg3);
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="op:flex op:items-center op:justify-between op:mb-3">
    <a class="header-left op:flex op:items-center op:gap-2 op:text-inherit op:no-underline" href="https://github.com/OmniLLM/omni-pilot" target="_blank" rel="noopener noreferrer" title="Open OmniPilot on GitHub">
      <div class="op:w-6 op:h-6 op:bg-accent op:flex op:items-center op:justify-center op:text-xs op:text-on-accent">✦</div>
      <span class="title op:font-display op:text-md op:font-strong op:tracking-heading">OmniPilot</span>
    </a>
  </div>

  <div class="op:h-px op:bg-line op:mb-3"></div>

  <div class="op:text-sm op:text-ink-muted op:leading-body op:mb-3" id="desc" data-i18n="selectTextDesc">Select text on any page for AI actions.</div>

  <div class="op:flex op:items-center op:gap-2 op:text-sm op:text-ink-muted op:mb-3">
    <span class="dot op:w-1.5 op:h-1.5 op:shrink-0" id="statusDot"></span>
    <span id="statusText" aria-live="polite">Checking…</span>
  </div>

  <div class="theme-row appearance-controls op:flex op:items-center op:justify-between op:gap-3 op:py-2.5 op:px-3 op:bg-surface op:shadow-1" aria-labelledby="appearanceLabel">
    <div class="theme-copy op:flex op:flex-col op:gap-0.5">
      <span class="theme-label op:text-sm op:font-strong op:text-ink" id="appearanceLabel" data-i18n="appearance">Appearance</span>
      <div class="preference-row">
        <label class="op:text-xs op:text-ink-muted" for="themePreferenceSelect" data-i18n="themePreference">Color theme</label>
        <select id="themePreferenceSelect">
          <option value="system" data-i18n="themeSystem">System</option>
          <option value="light" data-i18n="light">Light</option>
          <option value="dark" data-i18n="dark">Dark</option>
        </select>
      </div>
      <div class="preference-row">
        <label class="op:text-xs op:text-ink-muted" for="visualStylePreferenceSelect" data-i18n="visualStyle">Visual style</label>
        <select id="visualStylePreferenceSelect">
          <option value="current" data-i18n="visualStyleCurrent">Current</option>
          <option value="clean-minimal" data-i18n="visualStyleCleanMinimal">Clean Minimal</option>
          <option value="terminal" data-i18n="visualStyleTerminal">Terminal</option>
          <option value="warm-editorial" data-i18n="visualStyleWarmEditorial">Warm Editorial</option>
          <option value="neo-brutalist" data-i18n="visualStyleNeoBrutalist">Neo-brutalist</option>
        </select>
      </div>
    </div>
  </div>

  <div class="theme-row op:flex op:items-center op:justify-between op:gap-3 op:py-2.5 op:px-3 op:bg-surface op:shadow-1">
    <div class="theme-copy op:flex op:flex-col op:gap-0.5">
      <span class="theme-label op:text-sm op:font-strong op:text-ink" id="languageLabel" data-i18n="language">Language</span>
    </div>
    <select id="languageSelect" aria-label="Language">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </div>

  <button class="settings-btn op:flex op:items-center op:justify-center op:gap-1.5 op:w-full op:p-2 op:bg-surface op:text-ink op:text-sm op:font-medium op:font-body op:cursor-pointer" id="settingsBtn">
    <span>⚙</span> <span id="settingsLabel" data-i18n="settings">Settings</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
